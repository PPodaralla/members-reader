[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "members-reader"
version = "0.1.0"
description = "Read a members CSV file and list names sorted by last name."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["csv", "members"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
members-reader = "members_reader.cli:main"

[project.urls]
Homepage = "https://github.com/PPodaralla/members-reader"
Issues = "https://github.com/PPodaralla/members-reader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
members_reader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "README.md"]
addopts = "--doctest-modules --doctest-glob=README.md"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional for Python 3.9
